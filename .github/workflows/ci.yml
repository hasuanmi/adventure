# 说明：本仓库此前没有任何自动化门禁。本工作流补上 typecheck + build + 端到端冒烟。
# 已知未覆盖（待后续立项）：
#  - 无 ESLint/Prettier 配置（文档 §13 要求的 lint 未落地）
#  - apps/api/test 下两个 e2e spec 硬编码 localhost:3100，需要先起 API（本轮新增的冒烟脚本已覆盖同一条主链路）

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build shared-types
        run: pnpm --filter @huahua/shared-types build
      # api 的 tsc 依赖 Prisma Client 生成物（本地开发机通常已有，CI 上必须显式生成）
      - name: Prisma generate
        run: pnpm --filter @huahua/api prisma:generate
      - name: Typecheck all packages
        run: pnpm typecheck
      - name: Build API
        run: pnpm --filter @huahua/api build
      - name: Build Web
        run: pnpm --filter @huahua/web build

  smoke:
    name: API smoke (family + approval loop)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: huahua
          POSTGRES_PASSWORD: huahua_dev
          POSTGRES_DB: huahua
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U huahua -d huahua"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://huahua:huahua_dev@localhost:5432/huahua?schema=public
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      JWT_EXPIRES_IN: 30m
      REFRESH_TTL_DAYS: "30"
      API_PORT: "3000"
      CORS_ORIGINS: http://localhost:3000
      SMOKE_BASE: http://localhost:3000/api
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: huahua
      PGPASSWORD: huahua_dev
      PGDATABASE: huahua
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build shared-types
        run: pnpm --filter @huahua/shared-types build
      - name: Prisma generate
        run: pnpm --filter @huahua/api prisma:generate
      - name: Apply migrations
        run: pnpm --filter @huahua/api prisma:migrate
      - name: Seed reward profiles
        run: pnpm --filter @huahua/api prisma:seed
      - name: Build API
        run: pnpm --filter @huahua/api build
      - name: Start API and wait for health
        run: |
          node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          cat /tmp/api.log
          exit 1
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: "Smoke test (API: family, approval, multi-tenant, guards, CORS)"
        shell: pwsh
        run: ./scripts/p2-smoke.ps1
      # UI 回归门：P2 阶段三次回归（CORS 配错、脚本静默丢断言、"以为修好"的会话恢复）
      # 都是 typecheck/build/API 冒烟覆盖不到的纯前端问题，故用真实浏览器点一遍。
      - name: Build Web
        run: pnpm --filter @huahua/web build
      - name: Start Web preview (serves dist, proxies /api)
        run: |
          # 必须在 apps/web 作为项目根启动：从仓库根运行 vite preview 会找不到 apps/web/dist
          pnpm --filter @huahua/web preview --port 4173 > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173/ > /dev/null; then
              echo "Web preview is up"
              exit 0
            fi
            sleep 2
          done
          echo "Web preview did not start"
          cat /tmp/web.log
          exit 1
      - name: Browser UI check (headless Chrome, real clicks + assertions)
        env:
          PSQL: psql
        run: node scripts/browser-check.mjs --base http://localhost:4173 --out /tmp/ui-shots
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots
          path: /tmp/ui-shots
          if-no-files-found: ignore
      - name: API / web log on failure
        if: failure()
        run: cat /tmp/api.log /tmp/web.log || true
